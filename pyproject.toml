[project]
name = "satcoreg"
version = "0.1.0"
description = "非オルソの衛星画像を地理院シームレス空中写真に合わせ込む幾何補正ツール"
readme = "README.md"
authors = [
    { name = "shiwaku", email = "yohei.shiwaku@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "httpx",
    "numpy",
    "opencv-python-headless",
    "rasterio",
    "scipy",
]

[project.scripts]
satcoreg = "satcoreg:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.uv]
exclude-newer = "7 days"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]
